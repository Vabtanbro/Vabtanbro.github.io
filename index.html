ow)","children":[{"content":"Noised Latent &#x2192; Patchify &#x2192; Patch Embedding &#x2192; Timestep + Class Conditioning &#x2192; DiT Blocks &#xd7; N &#x2192; Regression Head &#x2192; Predict Noise &#x2192; Unpatchify &#x2192; Generated Image","children":[],"payload":{"tag":"li","lines":"245,247"}}],"payload":{"tag":"h3","lines":"244,245"}},{"content":"DiT Block Components","children":[{"content":"Multi-head Self-Attention","children":[],"payload":{"tag":"li","lines":"248,249"}},{"content":"Feed-Forward Network (MLP)","children":[],"payload":{"tag":"li","lines":"249,250"}},{"content":"Layer Normalization","children":[],"payload":{"tag":"li","lines":"250,251"}},{"content":"Skip Connections","children":[],"payload":{"tag":"li","lines":"251,252"}},{"content":"Conditioning mechanism (adaLN-Zero / FiLM)","children":[],"payload":{"tag":"li","lines":"252,254"}}],"payload":{"tag":"h3","lines":"247,248"}},{"content":"Conditioning Mechanisms","children":[{"content":"<strong>adaLN-Zero</strong> (Adaptive Layer Norm Zero)","children":[{"content":"Injects timestep + class info with zero initialization","children":[],"payload":{"tag":"li","lines":"256,257"}},{"content":"Strong performance, minimal compute overhead","children":[],"payload":{"tag":"li","lines":"257,258"}},{"content":"<em>MCQ: adaLN-Zero is efficient conditioning, not expensive cross-attention</em>","children":[],"payload":{"tag":"li","lines":"258,259"}}],"payload":{"tag":"li","lines":"255,259"}},{"content":"<strong>FiLM</strong>: <code>FiLM(x) = &#x3b3;x + &#x3b2;</code> (scale + shift)","children":[],"payload":{"tag":"li","lines":"259,261"}}],"payload":{"tag":"h3","lines":"254,255"}},{"content":"Key Concepts","children":[{"content":"<strong>Timestep Embedding</strong> &#x2014; tells model current noise level","children":[],"payload":{"tag":"li","lines":"262,263"}},{"content":"<strong>Class Conditioning</strong> &#x2014; guides category of generated image","children":[],"payload":{"tag":"li","lines":"263,264"}} rong &#x2014; still uses noise prediction)","children":[],"payload":{"tag":"li","lines":"285,286"}},{"content":"&#x274c; Smaller patch reduces computation (Wrong &#x2014; increases it)","children":[],"payload":{"tag":"li","lines":"286,287"}},{"content":"&#x274c; Higher FID means better quality (Wrong &#x2014; lower is better)","children":[],"payload":{"tag":"li","lines":"287,288"}},{"content":"&#x274c; adaLN-Zero is expensive cross-attention (Wrong &#x2014; it&apos;s efficient)","children":[],"payload":{"tag":"li","lines":"288,290"}}],"payload":{"tag":"h3","lines":"284,285"}}],"payload":{"tag":"h2","lines":"234,235"}},{"content":"6. Multimodal DiT (MM-DiT) &#x2014; Lecture 23","children":[{"content":"What is MM-DiT?","children":[{"content":"Processes <strong>image tokens + text tokens</strong> together","children":[],"payload":{"tag":"li","lines":"294,295"}},{"content":"Uses <strong>joint attention</strong> for text-to-image generation","children":[],"payload":{"tag":"li","lines":"295,296"}},{"content":"Example: &quot;Golden retriever with ball&quot; &#x2192; generate image","children":[],"payload":{"tag":"li","lines":"296,298"}}],"payload":{"tag":"h3","lines":"293,294"}},{"content":"Inputs","children":[{"content":"Noised latent image &#x2192; patches &#x2192; image tokens","children":[],"payload":{"tag":"li","lines":"299,300"}},{"content":"Text prompt &#x2192; text encoder (CLIP/T5) &#x2192; text tokens","children":[],"payload":{"tag":"li","lines":"300,301"}},{"content":"Timestep &#x2192; noise level embedding","children":[],"payload":{"tag":"li","lines":"301,303"}}],"payload":{"tag":"h3","lines":"298,299"}},{"content":"Joint Attention","children":[{"content":"Image patches &#x2194; text tokens interact bidirectionally","children":[],"payload":{"tag":"li","lines":"304,305"}},{"content":"Model learns: &quot;dog&quot; &#x2192; which image region | &quot;ball&quot; &#x2192; which patch","children":[],"payload":{"tag":"li","lines":"305,306"}},{"content":"<em>MCQ: Joint ":"li","lines":"327,328"}},{"content":"Simplifies transformation learning","children":[],"payload":{"tag":"li","lines":"328,330"}}],"payload":{"tag":"h3","lines":"326,327"}}],"payload":{"tag":"h2","lines":"292,293"}},{"content":"7. Retrieval-Augmented Generation (RAG)","children":[{"content":"What is RAG?","children":[{"content":"Framework: connects LLMs with external knowledge sources","children":[],"payload":{"tag":"li","lines":"334,335"}},{"content":"Reduces hallucination, provides updated/domain-specific knowledge","children":[],"payload":{"tag":"li","lines":"335,336"}},{"content":"User Query &#x2192; Retrieve Relevant Info &#x2192; Generate Answer","children":[],"payload":{"tag":"li","lines":"336,338"}}],"payload":{"tag":"h3","lines":"333,334"}},{"content":"Why RAG?","children":[{"content":"LLM problems: Hallucination, Outdated knowledge, No domain-specific data, No source grounding","children":[],"payload":{"tag":"li","lines":"339,340"}},{"content":"RAG grounds responses in retrieved external knowledge","children":[],"payload":{"tag":"li","lines":"340,342"}}],"payload":{"tag":"h3","lines":"338,339"}},{"content":"Main Components","children":[{"content":"<strong>Retriever</strong> &#x2014; query &#x2192; vector &#x2192; search &#x2192; relevant passages","children":[],"payload":{"tag":"li","lines":"343,344"}},{"content":"<strong>Generator</strong> &#x2014; query + retrieved context &#x2192; LLM &#x2192; final answer","children":[],"payload":{"tag":"li","lines":"344,346"}}],"payload":{"tag":"h3","lines":"342,343"}},{"content":"RAG Workflow","children":[{"content":"Query Processing &#x2192; Query Embedding &#x2192; Vector DB Search &#x2192; Retrieved Docs &#x2192; LLM &#x2192; Answer","children":[],"payload":{"tag":"li","lines":"347,349"}}],"payload":{"tag":"h3","lines":"346,347"}},{"content":"Dense Passage Retrieval (DPR)","children":[{"content":"Query + passages converted to <strong>dense vectors</strong>","children":[],"payload":{"tag":"li","lines":"350,351"}}, l pipeline","children":[],"payload":{"tag":"li","lines":"480,481"}},{"content":"<strong>Multi-Agentic RAG</strong> &#x2014; multiple specialized agents","children":[],"payload":{"tag":"li","lines":"481,482"}},{"content":"<strong>Hierarchical Agentic RAG</strong> &#x2014; master agent + specialized sub-agents","children":[],"payload":{"tag":"li","lines":"482,483"}},{"content":"<strong>Agentic Corrective RAG</strong> &#x2014; detects poor retrieval &#x2192; corrects/re-retrieves","children":[],"payload":{"tag":"li","lines":"483,485"}}],"payload":{"tag":"h3","lines":"479,480"}},{"content":"Traditional RAG vs Agentic RAG","children":[{"content":"<table data-lines=\"486,493\">\n<thead data-lines=\"486,487\">\n<tr data-lines=\"486,487\">\n<th>Feature</th>\n<th>Traditional RAG</th>\n<th>Agentic RAG</th>\n</tr>\n</thead>\n<tbody data-lines=\"488,493\">\n<tr data-lines=\"488,489\">\n<td>Pipeline</td>\n<td>Fixed</td>\n<td>Dynamic</td>\n</tr>\n<tr data-lines=\"489,490\">\n<td>Reasoning</td>\n<td>Limited</td>\n<td>Stronger</td>\n</tr>\n<tr data-lines=\"490,491\">\n<td>Planning</td>\n<td>Absent</td>\n<td>Present</td>\n</tr>\n<tr data-lines=\"491,492\">\n<td>Tool use</td>\n<td>Limited</td>\n<td>Adaptive</td>\n</tr>\n<tr data-lines=\"492,493\">\n<td>Verification</td>\n<td>Weak</td>\n<td>Self-reflection</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"486,493"}}],"payload":{"tag":"h3","lines":"485,486"}}],"payload":{"tag":"h2","lines":"442,443"}},{"content":"10. Generative AI &amp; Agentic AI (Lecture 27)","children":[{"content":"Generative AI","children":[{"content":"Creates new content: text, images, audio, video, code","children":[],"payload":{"tag":"li","lines":"498,499"}},{"content":"Based on Transformers (encoder-decoder + attention)","children":[],"payload":{"tag":"li","lines":"499,500"}},{"content":"Generates by learning statistical patterns from training data","children":[],"payload":{"tag":"li","lines":"500,501"}},{"content":"<strong>Prompt</strong> &#x2014; input instruction to control output","children":[],"payload":{"tag":"li","lines":"501,502"}},{"content":"<strong>Prompt Design</strong> &#x2014; crafting effective prompts for desired outputs","children":[],"payload":{"tag":"li","lines":"502,504"}}],"payload":{"tag":"h3","lines":"497,498"}},{"content":"Hallucination","children":[{"content":"Model generates incorrect/misleading/unsupported content","children":[],"payload":{"tag":"li","lines":"505,506"}},{"content":"Causes: incomplete data, outdated knowledge, ambiguous prompt","children":[],"payload":{"tag":"li","lines":"506,507"}},{"content":"Solutions: RAG, citations, tools, human review, better prompts","children":[],"payload":{"tag":"li","lines":"507,509"}}],"payload":{"tag":"h3","lines":"504,505"}},{"content":"Code Generation","children":[{"content":"Debug, explain, generate SQL, translate code, write documentation","children":[],"payload":{"tag":"li","lines":"510,512"}}],"payload":{"tag":"h3","lines":"509,510"}},{"content":"Evolution of AI","children":[{"content":"Traditional Programming &#x2192; Neural Networks &#x2192; Generative AI","children":[],"payload":{"tag":"li","lines":"513,515"}}],"payload":{"tag":"h3","lines":"512,513"}},{"content":"Agentic AI","children":[{"content":"Understands goals, plans actions, uses tools, executes tasks, adapts","children":[],"payload":{"tag":"li","lines":"516,517"}},{"content":"Generative AI = creates content | Agentic AI = plans + acts + learns","children":[],"payload":{"tag":"li","lines":"517,519"}}],"payload":{"tag":"h3","lines":"515,516"}},{"content":"Agentic AI Working","children":[{"content":"<strong>Understanding</strong> &#x2014; LLM processes data, understands task","children":[],"payload":{"tag":"li","lines":"520,521"}},{"content":"<strong>Goal Setting</strong> &#x2014; identifies objectives, plans strategy","children":[],"payload":{"tag":"li","lines":"521,522"}},{"content":"<strong>Execution</strong> &#x2014; performs tasks with APIs, tools, automation","children":[],"payload":{"tag":"li","lines":"522,523"}},{"content":"<strong>Learning</strong> &#x2014; improves through interaction and feedback","children":[],"payload":{"tag":"li","lines":"523,525"}}],"payload":{"tag":"h3","lines":"519,520"}},{"content":"Agentic AI Architecture","children":[{"content":"User Request &#x2192; Perception &#x2192; Multi-modal Fusion &#x2192; Cognition &#x2192; Memory &#x2192; Knowledge Base &#x2192; Action &#x2192; Monitors","children":[],"payload":{"tag":"li","lines":"526,528"}}],"payload":{"tag":"h3","lines":"525,526"}},{"content":"Generative AI vs Agentic AI","children":[{"content":"<table data-lines=\"529,536\">\n<thead data-lines=\"529,530\">\n<tr data-lines=\"529,530\">\n<th>Feature</th>\n<th>Generative AI</th>\n<th>Agentic AI</th>\n</tr>\n</thead>\n<tbody data-lines=\"531,536\">\n<tr data-lines=\"531,532\">\n<td>Function</td>\n<td>Creates content</td>\n<td>Performs actions</td>\n</tr>\n<tr data-lines=\"532,533\">\n<td>Output</td>\n<td>Text/image/code</td>\n<td>Completed task</td>\n</tr>\n<tr data-lines=\"533,534\">\n<td>Autonomy</td>\n<td>Low&#x2013;medium</td>\n<td>High</td>\n</tr>\n<tr data-lines=\"534,535\">\n<td>Planning</td>\n<td>Limited</td>\n<td>Strong</td>\n</tr>\n<tr data-lines=\"535,536\">\n<td>Tool use</td>\n<td>Optional</td>\n<td>Core ability</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"529,536"}}],"payload":{"tag":"h3","lines":"528,529"}},{"content":"Applications of Agentic AI","children":[{"content":"Customer service, Healthcare, Finance, Autonomous vehicles, CRM, Education","children":[],"payload":{"tag":"li","lines":"538,540"}}],"payload":{"tag":"h3","lines":"537,538"}},{"content":"Benefits of Agentic AI","children":[{"content":"Efficiency, Scalability, Adaptability, Collaboration, Cost reduction, Continuous learning","children":[],"payload":{"tag":"li","lines":"541,543"}}],"payload":{"tag":"h3","lines":"540,541"}},{"content":"Risks","children":[{"content":"Wrong autonomous decisions, Bias, Privacy issues, Security vulnerabilities, Loss of human control","children":[],"payload":{"tag":"li","lines":"544,546"}}],"payload":{"tag":"h3","lines":"543,544"}}],"payload":{"tag":"h2","lines":"496,497"}},{"content":"11. Multi-Agent Systems &amp; MCP (Lecture 28)","children":[{"content":"Multi-Agent Systems","children":[{"content":"Multiple intelligent agents collaborate, each with specialized roles","children":[],"payload":{"tag":"li","lines":"550,551"}},{"content":"Planning, Reasoning, Retrieval, Evaluation, Execution","children":[],"payload":{"tag":"li","lines":"551,553"}}],"payload":{"tag":"h3","lines":"549,550"}},{"content":"Why Multi-Agent?","children":[{"content":"Single agents struggle with: complex tasks, long workflows, verification, parallel execution","children":[],"payload":{"tag":"li","lines":"554,556"}}],"payload":{"tag":"h3","lines":"553,554"}},{"content":"Agent Components","children":[{"content":"<strong>Memory</strong> &#x2014; short-term (conversation) + long-term (history)","children":[],"payload":{"tag":"li","lines":"557,558"}},{"content":"<strong>Planning</strong> &#x2014; CoT reasoning, self-critique, task decomposition","children":[],"payload":{"tag":"li","lines":"558,559"}},{"content":"<strong>Tools</strong> &#x2014; search, calculator, code interpreter, APIs, databases","children":[],"payload":{"tag":"li","lines":"559,560"}},{"content":"<strong>Actions</strong> &#x2014; retrieve, call API, generate response, update DB","children":[],"payload":{"tag":"li","lines":"560,561"}},{"content":"Feedback loop: Input &#x2192; Reasoning &#x2192; Tool Use &#x2192; Action &#x2192; Feedback &#x2192; Memory Update","children":[],"payload":{"tag":"li","lines":"561,563"}}],"payload":{"tag":"h3","lines":"556,557"}},{"content":"Common Agent Roles","children":[{"content":"<table data-lines=\"564,572\">\n<thead data-lines=\"564,565\">\n<tr data-lines=\"564,565\">\n<th>Agent Type</th>\n<th>Role</th>\n</tr>\n</thead>\n<tbody data-lines=\"566,572\">\n<tr data-lines=\"566,567\">\n<td>Planner</td>\n<td>Breaks task into steps</td>\n</tr>\n<tr data-lines=\"567,568\">\n<td>Retriever</td>\n<td>Searches knowledge sources</td>\n</tr>\n<tr data-lines=\"568,569\">\n<td>Reasoning</td>\n<td>Logical analysis</td>\n</tr>\n<tr data-lines=\"569,570\">\n<td>Tool</td>\n<td>Calls APIs/tools</td>\n</tr>\n<tr data-lines=\"570,571\">\n<td>Critic</td>\n<td>Evaluates output</td>\n</tr>\n<tr data-lines=\"571,572\">\n<td>Coordinator</td>\n<td>Manages all agents</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"564,572"}}],"payload":{"tag":"h3","lines":"563,564"}},{"content":"Workflows vs Agents","children":[{"content":"<strong>Workflow</strong> &#x2014; predefined path, fixed rules, lower flexibility","children":[],"payload":{"tag":"li","lines":"574,575"}},{"content":"<strong>Agent</strong> &#x2014; dynamic decision-making, adaptive tool use, handles complex changing tasks","children":[],"payload":{"tag":"li","lines":"575,577"}}],"payload":{"tag":"h3","lines":"573,574"}},{"content":"Workflow Types","children":[{"content":"Prompt Chaining &#x2192; Routing &#x2192; Parallelization &#x2192; Orchestrator-Workers &#x2192; Evaluator-Optimizer","children":[],"payload":{"tag":"li","lines":"578,580"}}],"payload":{"tag":"h3","lines":"577,578"}},{"content":"Use Cases","children":[{"content":"Customer Service, Personal Productivity, Healthcare, Finance, Sales, Manufacturing, Education, Home Automation","children":[],"payload":{"tag":"li","lines":"581,583"}}],"payload":{"tag":"h3","lines":"580,581"}},{"content":"MCP &#x2014; Model Context Protocol","children":[{"content":"Standardized mechanism for agents/models to access external tools, data, services","children":[],"payload":{"tag":"li","lines":"584,585"}},{"content":"Acts as common bridge: Agents &#x2192; MCP &#x2192; Tools/Data/Services","children":[],"payload":{"tag":"li","lines":"585,586"}},{"content":"Prevents need for custom integrations per tool","children":[],"payload":{"tag":"li","lines":"586,588"}}],"payload":{"tag":"h3","lines":"583,584"}},{"content":"Multi-Agent vs MCP","children":[{"content":"<table data-lines=\"589,593\">\n<thead data-lines=\"589,590\">\n<tr data-lines=\"589,590\">\n<th>Feature</th>\n<th>Multi-Agent System</th>\n<th>MCP</th>\n</tr>\n</thead>\n<tbody data-lines=\"591,593\">\n<tr data-lines=\"591,592\">\n<td>Role</td>\n<td>Coordination &amp; task division</td>\n<td>Standardized external access</td>\n</tr>\n<tr data-lines=\"592,593\">\n<td>Focus</td>\n<td>How agents work together</td>\n<td>How agents use resources</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"589,593"}}],"payload":{"tag":"h3","lines":"588,589"}},{"content":"Benefits of Multi-Agent Systems","children":[{"content":"Specialization, Parallelism, Scalability, Better reliability, Tool integration","children":[],"payload":{"tag":"li","lines":"595,597"}}],"payload":{"tag":"h3","lines":"594,595"}},{"content":"Challenges","children":[{"content":"Coordination complexity, Higher cost, Latency, Conflicting outputs, Error propagation","children":[],"payload":{"tag":"li","lines":"598,600"}}],"payload":{"tag":"h3","lines":"597,598"}}],"payload":{"tag":"h2","lines":"548,549"}},{"content":"12. Constitutional AI (Lecture 29)","children":[{"content":"What is Constitutional AI?","children":[{"content":"Proposed by <strong>Anthropic</strong> (Bai et al., 2022)","children":[],"payload":{"tag":"li","lines":"604,605"}},{"content":"AI trained to follow predefined <strong>ethical + legal + operational principles</strong>","children":[],"payload":{"tag":"li","lines":"605,606"}},{"content":"Goal: Helpful + Honest + Harmless (HHH)","children":[],"payload":{"tag":"li","lines":"606,608"}}],"payload":{"tag":"h3","lines":"603,604"}},{"content":"Why Needed?","children":[{"content":"LLM problems: Harmful responses, Bias, Misinformation, No transparency, Privacy risks","children":[],"payload":{"tag":"li","lines":"609,611"}}],"payload":{"tag":"h3","lines":"608,609"}},{"content":"Core Idea","children":[{"content":"AI evaluates and revises its own responses using a written <strong>constitution</strong>","children":[],"payload":{"tag":"li","lines":"612,613"}},{"content":"Prompt &#x2192; Response &#x2192; <strong>AI Self-Critique</strong> &#x2192; Revised Response","children":[],"payload":{"tag":"li","lines":"613,615"}}],"payload":{"tag":"h3","lines":"611,612"}},{"content":"Two Training Phases","children":[{"content":"Phase 1: Supervised Learning","children":[{"content":"Prompt &#x2192; Initial Response &#x2192; Critique using constitution &#x2192; Revised Response &#x2192; Fine-tuning","children":[],"payload":{"tag":"li","lines":"617,618"}},{"content":"Model learns from its own revised (safer) responses","children":[],"payload":{"tag":"li","lines":"618,620"}}],"payload":{"tag":"h4","lines":"616,617"}},{"content":"Phase 2: Reinforcement Learning (RLAIF)","children":[{"content":"Model generates response pairs &#x2192; AI evaluates using constitution &#x2192; Preference data &#x2192; Preference model &#x2192; RL improves model","children":[],"payload":{"tag":"li","lines":"621,622"}},{"content":"<strong>RLAIF</strong> = Reinforcement Learning from AI Feedback","children":[],"payload":{"tag":"li","lines":"622,624"}}],"payload":{"tag":"h4","lines":"620,621"}}],"payload":{"tag":"h3","lines":"615,616"}},{"content":"RLHF vs RLAIF","children":[{"content":"<table data-lines=\"625,632\">\n<thead data-lines=\"625,626\">\n<tr data-lines=\"625,626\">\n<th>Feature</th>\n<th>RLHF</th>\n<th>RLAIF</th>\n</tr>\n</thead>\n<tbody data-lines=\"627,632\">\n<tr data-lines=\"627,628\">\n<td>Feedback</td>\n<td>Humans</td>\n<td>AI model</td>\n</tr>\n<tr data-lines=\"628,629\">\n<td>Scalability</td>\n<td>Lower</td>\n<td>Higher</td>\n</tr>\n<tr data-lines=\"629,630\">\n<td>Cost</td>\n<td>Higher</td>\n<td>Lower</td>\n</tr>\n<tr data-lines=\"630,631\">\n<td>Human oversight</td>\n<td>Stronger</td>\n<td>Weaker</td>\n</tr>\n<tr data-lines=\"631,632\">\n<td>Risk</td>\n<td>Human bias</td>\n<td>AI bias</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"625,632"}}],"payload":{"tag":"h3","lines":"624,625"}},{"content":"Constitutional AI Workflow","children":[{"content":"Human-written Constitution &#x2192; Prompt &#x2192; Response &#x2192; AI Critique &#x2192; Revised Response &#x2192; SFT &#x2192; Response Pairs &#x2192; AI Preference &#x2192; Preference Model &#x2192; RLAIF &#x2192; Final Model","children":[],"payload":{"tag":"li","lines":"634,636"}}],"payload":{"tag":"h3","lines":"633,634"}},{"content":"Ethical Values Embedded","children":[{"content":"Fairness &amp; Non-discrimination","children":[],"payload":{"tag":"li","lines":"637,638"}},{"content":"Transparency","children":[],"payload":{"tag":"li","lines":"638,639"}},{"content":"Accountability","children":[],"payload":{"tag":"li","lines":"639,640"}},{"content":"Privacy &amp; Security","children":[],"payload":{"tag":"li","lines":"640,641"}},{"content":"Safety","children":[],"payload":{"tag":"li","lines":"641,643"}}],"payload":{"tag":"h3","lines":"636,637"}},{"content":"Work Process Stages","children":[{"content":"<strong>Establishing the Constitution</strong> &#x2014; ethical, legal, operational principles","children":[],"payload":{"tag":"li","lines":"644,645"}},{"content":"<strong>Data Annotation</strong> &#x2014; human reviewers label based on rules","children":[],"payload":{"tag":"li","lines":"645,646"}},{"content":"<strong>RLHF/RLAIF</strong> &#x2014; human/AI feedback refines alignment","children":[],"payload":{"tag":"li","lines":"646,647"}},{"content":"<strong>Continuous Monitoring</strong> &#x2014; update guidelines, retrain, add examples","children":[],"payload":{"tag":"li","lines":"647,648"}},{"content":"<strong>Dynamic Scenario Simulations</strong> &#x2014; test on diverse real-world cases","children":[],"payload":{"tag":"li","lines":"648,649"}},{"content":"<strong>Balancing Flexibility &amp; Rigor</strong>","children":[],"payload":{"tag":"li","lines":"649,651"}}],"payload":{"tag":"h3","lines":"643,644"}},{"content":"Harmlessness vs Helpfulness","children":[{"content":"Traditional RLHF may trade off one for the other","children":[],"payload":{"tag":"li","lines":"652,653"}},{"content":"Constitutional AI aims for <strong>Pareto improvement</strong> &#x2014; both improve together","children":[],"payload":{"tag":"li","lines":"653,655"}}],"payload":{"tag":"h3","lines":"651,652"}},{"content":"Limitations","children":[{"content":"Principles can be vague, context-dependent","children":[],"payload":{"tag":"li","lines":"656,657"}},{"content":"AI feedback can still be biased","children":[],"payload":{"tag":"li","lines":"657,658"}},{"content":"Human oversight still needed","children":[],"payload":{"tag":"li","lines":"658,659"}},{"content":"Hard to define universal constitution","children":[],"payload":{"tag":"li","lines":"659,660"}},{"content":"High-stakes domains need human-in-the-loop","children":[],"payload":{"tag":"li","lines":"660,662"}}],"payload":{"tag":"h3","lines":"655,656"}},{"content":"Applications","children":[{"content":"Content Moderation, Customer Service, Healthcare, Finance, Education, Legal Systems","children":[],"payload":{"tag":"li","lines":"663,665"}}],"payload":{"tag":"h3","lines":"662,663"}}],"payload":{"tag":"h2","lines":"602,603"}},{"content":"13. Sub-word Tokenization (Lecture 30)","children":[{"content":"What is Tokenization?","children":[{"content":"Breaking text into smaller units: words, subwords, characters, bytes","children":[],"payload":{"tag":"li","lines":"669,670"}},{"content":"Pipeline: Text &#x2192; Tokens &#x2192; Token IDs &#x2192; Embeddings &#x2192; Model","children":[],"payload":{"tag":"li","lines":"670,672"}}],"payload":{"tag":"h3","lines":"668,669"}},{"content":"Why Sub-word Tokenization?","children":[{"content":"Word-level: rare words become [UNK]","children":[],"payload":{"tag":"li","lines":"673,674"}},{"content":"Character-level: very long sequences","children":[],"payload":{"tag":"li","lines":"674,675"}},{"content":"Sub-word: balances both &#x2014; handles rare words, manageable length","children":[],"payload":{"tag":"li","lines":"675,677"}}],"payload":{"tag":"h3","lines":"672,673"}},{"content":"Algorithm 1: Byte-Pair Encoding (BPE)","children":[{"content":"Core Idea","children":[{"content":"Start with characters &#x2192; repeatedly merge most frequent adjacent pair","children":[],"payload":{"tag":"li","lines":"679,680"}},{"content":"Used in: GPT, GPT-2, RoBERTa, BART, DeBERTa","children":[],"payload":{"tag":"li","lines":"680,682"}}],"payload":{"tag":"h4","lines":"678,679"}},{"content":"Training Steps","children":[{"content":"Pre-tokenize corpus &#x2192; base character vocabulary &#x2192; count adjacent pairs &#x2192; merge most frequent &#x2192; repeat until desired vocab size","children":[],"payload":{"tag":"li","lines":"683,685"}}],"payload":{"tag":"h4","lines":"682,683"}},{"content":"Tokenization","children":[{"content":"Apply learned merge rules greedily in order learned","children":[],"payload":{"tag":"li","lines":"686,687"}},{"content":"Example: bags &#x2192; b, ag, s (if a+g &#x2192; ag was learned)","children":[],"payload":{"tag":"li","lines":"687,689"}}],"payload":{"tag":"h4","lines":"685,686"}},{"content":"Byte-level BPE","children":[{"content":"GPT-2, RoBERTa use bytes (256) as base vocab &#x2192; reduces unknown tokens","children":[],"payload":{"tag":"li","lines":"690,692"}}],"payload":{"tag":"h4","lines":"689,690"}}],"payload":{"tag":"h3","lines":"677,678"}},{"content":"Algorithm 2: WordPiece","children":[{"content":"Core Idea","children":[{"content":"Similar to BPE but merges based on <strong>likelihood/score</strong> not frequency","children":[],"payload":{"tag":"li","lines":"694,695"}},{"content":"Used in: BERT, DistilBERT, MobileBERT","children":[],"payload":{"tag":"li","lines":"695,696"}},{"content":"Internal tokens prefixed with <code>##</code>","children":[],"payload":{"tag":"li","lines":"696,698"}}],"payload":{"tag":"h4","lines":"693,694"}},{"content":"Key Difference from BPE","children":[{"content":"Score = probability(merged) / probability(individual parts)","children":[],"payload":{"tag":"li","lines":"699,700"}},{"content":"Tokenization: <strong>longest-match-first</strong> (not apply merge rules)","children":[],"payload":{"tag":"li","lines":"700,702"}}],"payload":{"tag":"h4","lines":"698,699"}},{"content":"Example (BERT)","children":[{"content":"<code>token &#x2192; t ##o ##k ##e ##n</code>","children":[],"payload":{"tag":"li","lines":"703,704"}},{"content":"<code>fused &#x2192; f, ##u, ##s, ##ed</code>","children":[],"payload":{"tag":"li","lines":"704,706"}}],"payload":{"tag":"h4","lines":"702,703"}},{"content":"Unknown Handling","children":[{"content":"WordPiece: whole word may become [UNK] if tokenization fails","children":[],"payload":{"tag":"li","lines":"707,708"}},{"content":"BPE: only missing character becomes [UNK]","children":[],"payload":{"tag":"li","lines":"708,710"}}],"payload":{"tag":"h4","lines":"706,707"}}],"payload":{"tag":"h3","lines":"692,693"}},{"content":"Algorithm 3: Unigram Tokenization","children":[{"content":"Core Idea","children":[{"content":"Starts with <strong>large vocabulary</strong> and <strong>removes</strong> less useful tokens","children":[],"payload":{"tag":"li","lines":"712,713"}},{"content":"BPE/WordPiece: start small &#x2192; add | Unigram: start large &#x2192; remove","children":[],"payload":{"tag":"li","lines":"713,714"}},{"content":"Used in: T5, ALBERT, mBART, XLNet (via SentencePiece)","children":[],"payload":{"tag":"li","lines":"714,716"}}],"payload":{"tag":"h4","lines":"711,712"}},{"content":"Training Steps","children":[{"content":"Initialize large vocab (chars + frequent substrings) &#x2192; unigram language model &#x2192; compute log-likelihood loss &#x2192; find tokens to remove &#x2192; remove least useful &#x2192; repeat","children":[],"payload":{"tag":"li","lines":"717,719"}}],"payload":{"tag":"h4","lines":"716,717"}},{"content":"EM Algorithm","children":[{"content":"<strong>E-step</strong> &#x2014; estimate likely segmentations using current probabilities","children":[],"payload":{"tag":"li","lines":"720,721"}},{"content":"<strong>M-step</strong> &#x2014; update token probabilities based on segmentations","children":[],"payload":{"tag":"li","lines":"721,723"}}],"payload":{"tag":"h4","lines":"719,720"}},{"content":"Key Advantage","children":[{"content":"Supports <strong>multiple segmentation candidates</strong> (probabilistic)","children":[],"payload":{"tag":"li","lines":"724,725"}},{"content":"BPE is deterministic; Unigram can consider all possible segmentations","children":[],"payload":{"tag":"li","lines":"725,727"}}],"payload":{"tag":"h4","lines":"723,724"}}],"payload":{"tag":"h3","lines":"710,711"}},{"content":"BPE vs WordPiece vs Unigram","children":[{"content":"<table data-lines=\"728,736\">\n<thead data-lines=\"728,729\">\n<tr data-lines=\"728,729\">\n<th>Feature</th>\n<th>BPE</th>\n<th>WordPiece</th>\n<th>Unigram</th>\n</tr>\n</thead>\n<tbody data-lines=\"730,736\">\n<tr data-lines=\"730,731\">\n<td>Starting vocab</td>\n<td>Characters/bytes</td>\n<td>Characters + ##</td>\n<td>Large candidates</td>\n</tr>\n<tr data-lines=\"731,732\">\n<td>Direction</td>\n<td>Add by merging</td>\n<td>Add by likelihood merging</td>\n<td>Remove tokens</td>\n</tr>\n<tr data-lines=\"732,733\">\n<td>Criterion</td>\n<td>Most frequent pair</td>\n<td>Highest score</td>\n<td>Lowest loss contribution</td>\n</tr>\n<tr data-lines=\"733,734\">\n<td>Tokenization</td>\n<td>Greedy merge rules</td>\n<td>Longest-match-first</td>\n<td>Probabilistic best</td>\n</tr>\n<tr data-lines=\"734,735\">\n<td>Multiple segmentations</td>\n<td>No</td>\n<td>Limited</td>\n<td>Yes</td>\n</tr>\n<tr data-lines=\"735,736\">\n<td>Models</td>\n<td>GPT, RoBERTa</td>\n<td>BERT, DistilBERT</td>\n<td>T5, ALBERT, XLNet</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"728,736"}}],"payload":{"tag":"h3","lines":"727,728"}},{"content":"Key Exam Points","children":[{"content":"BPE = frequency-based merging","children":[],"payload":{"tag":"li","lines":"738,739"}},{"content":"WordPiece = likelihood/score-based merging","children":[],"payload":{"tag":"li","lines":"739,740"}},{"content":"Unigram = probability-based pruning","children":[],"payload":{"tag":"li","lines":"740,741"}},{"content":"GPT-2/RoBERTa &#x2192; byte-level BPE","children":[],"payload":{"tag":"li","lines":"741,742"}},{"content":"BERT &#x2192; WordPiece with ##","children":[],"payload":{"tag":"li","lines":"742,743"}},{"content":"T5/ALBERT/XLNet &#x2192; Unigram/SentencePiece","children":[],"payload":{"tag":"li","lines":"743,744"}},{"content":"MCQ trap: &quot;ViT doesn&apos;t need positional encoding&quot; &#x2192; <strong>Wrong, it DOES</strong>","children":[],"payload":{"tag":"li","lines":"744,745"}},{"content":"MCQ trap: WordPiece same as BPE &#x2192; <strong>Wrong &#x2014; different merge criterion</strong>","children":[],"payload":{"tag":"li","lines":"745,746"}}],"payload":{"tag":"h3","lines":"737,738"}}],"payload":{"tag":"h2","lines":"667,668"}}],"payload":{"tag":"h1","lines":"6,7"}},{"colorFreezeLevel":2})</script>
